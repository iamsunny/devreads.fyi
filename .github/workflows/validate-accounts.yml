name: Validate accounts and static site

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'migrations/**'
      - 'package*.json'
      - '*config*'
      - '.github/workflows/validate-accounts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck:worker
      - run: npm run build
      - run: npm run test:accounts
      - run: npm run check:analytics
      - run: npm run check:sharing
      - run: npm audit --audit-level=high
